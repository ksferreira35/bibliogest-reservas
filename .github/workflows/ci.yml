name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          overwrite-settings: false
      - name: Verificar código Java
        run: mvn --batch-mode --no-transfer-progress --fail-fast validate

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          overwrite-settings: false
      - name: Rodar testes
        run: mvn --batch-mode --no-transfer-progress --fail-fast test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          overwrite-settings: false
      - name: Empacotar a API
        run: mvn --batch-mode --no-transfer-progress --fail-fast -DskipTests verify
